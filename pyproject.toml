[project]
name = "claudechip-bridge"
version = "0.3.1"
description = "Bridge between Claude Code on a Mac and the Claude Chip desk device"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Squeeze Design", email = "info@squeezedesign.es" }]
# Standard library only: runs with the python3 that ships with macOS
dependencies = []

[project.urls]
Homepage = "https://squeezedesign.es"

[project.scripts]
claudechip-bridge = "claudechip_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudechip_bridge"]
