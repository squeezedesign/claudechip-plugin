[project]
name = "claudechip-bridge"
version = "0.1.0"
description = "Bridge between Claude Code on a Mac and the Claude Chip desk device"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "zeroconf>=0.136",
]

[project.scripts]
claudechip-bridge = "claudechip_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudechip_bridge"]
